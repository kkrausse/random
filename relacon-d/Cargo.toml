[package]
name = "relacon-d"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
core-foundation = "0.10.1"
core-foundation-sys = "0.8"
libc = "0.2.191"
objc2 = "0.6.5"
oxc_allocator = "0.133.0"
oxc_codegen = "0.133.0"
oxc_diagnostics = "0.133"
oxc_parser = "0.133.0"
oxc_semantic = "0.133.0"
oxc_sourcemap = "6.1.1"
oxc_span = "0.133.0"
oxc_transformer = "0.133.0"
rquickjs = "0.14.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
