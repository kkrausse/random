<!doctype html><meta charset="utf-8"><title>example</title>
<script type="module">
import { draw, box, text, row, col, arrow } from "https://raspberrypi.guineafowl-truck.ts.net/artifacts/excalidraw-lib/x.js";

const layer = (i) => row(40, box(`sa${i}`, `self-attention ${i}\n372 × 1024`, { bg: "blue" }), box(`ff${i}`, `feed-forward ${i}`, { bg: "orange" }));

draw([
  col(50,
    row(60, box("q", "query strip\n176 × 512 × 3 px"), box("c", "calibration frame k", { bg: "green" })),
    box("fz", "FROZEN blocks 1 – 12\nout: 361 × 1024", { bg: "gray", w: 420 }),
    layer(1), layer(2),
    text("note", "the head reads the readout token only", { ink: "gray" })),
  arrow("q", "fz"), arrow("c", "fz", "", { stroke: "dashed" }),
  arrow("fz", "sa1", "361 × 1024"), arrow("sa1", "ff1"), arrow("ff1", "sa2"), arrow("sa2", "ff2"),
]);
</script>
