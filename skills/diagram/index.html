<!doctype html>
<meta charset="utf-8">
<title>diagram</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px DejaVu Sans Mono, Menlo, monospace; background: #fff; }
  #stage, #stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage { cursor: default; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage.pan { cursor: grab; }
  #stage [data-id] { cursor: pointer; }
  .sel-box { fill: none; stroke: #e8590c; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
  .band { fill: rgba(25, 113, 194, .08); stroke: #1971c2; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .moved { opacity: .9; }
  #bar { position: fixed; top: 6px; right: 8px; font-size: 11px; color: #e03131; user-select: none; }
  #bar b { color: #e03131; cursor: pointer; font-weight: normal; }
  #issues { display: none; position: fixed; top: 30px; right: 10px; max-width: 60vw; max-height: 60vh; overflow: auto; background: #fff8f8;
    border: 1px solid #ffc9c9; padding: 8px 10px; white-space: pre; }
  #fb { position: fixed; left: 8px; bottom: 6px; color: #868e96; font-size: 11px; display: none; user-select: none; }
  #toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #1e1e1e; color: #fff; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: .9; }
  #fb a { color: #1971c2; cursor: pointer; margin-left: 6px; }
</style>
<div id="stage"></div>
<div id="bar"><span id="when"></span> <b id="nissues"></b></div>
<div id="issues"></div>
<div id="fb"><span id="fbn"></span> <a id="fbcopy">copy</a> <a id="fbreset">reset</a></div>
<div id="toast"></div>
<script src="avoid.js"></script>
<script>document.write(`<script src="core.js?v=${Date.now()}"><\/script>`);</script>
<script>
"use strict";
const q = new URLSearchParams(location.search), SRC = q.get("s"), ONLY = q.get("only") ?? undefined;
const stage = document.getElementById("stage"), $ = (id) => document.getElementById(id);
const srcURL = SRC ? new URL(SRC, location.href).href : null;
let page = null, svg = null, key = "", cam = null, sel = new Set();
// moves and notes live only in this page: a reload, or a new version of the diagram, starts clean
let fb = { moves: {}, notes: [] };
const saveFb = () => showFb();

// ---- load: re-run the diagram file every 2 s in a fresh hidden iframe (its own globals; works on file://); redraw on change
const coreURL = new URL("core.js?v=" + Date.now(), location.href).href;
let busy = false;
// the viewer's own code: when core.js is republished, an open page reloads itself (the view is kept in the URL)
let coreText = null;
async function checkCore() {
  try { const t = await (await fetch(new URL("core.js?t=" + Date.now(), location.href), { cache: "no-store" })).text();
    if (coreText === null) coreText = t; else if (t !== coreText) location.reload(); } catch {}  // file:// cannot fetch: skip
}
function poll() {
  checkCore();
  if (!SRC) { $("when").textContent = "add ?s=<diagram.js>"; return; }
  if (busy) return; busy = true;
  const f = document.createElement("iframe"); f.style.display = "none";
  f.srcdoc = `<script>onerror = (m, u, l) => { parent.__dgErr = m + " (line " + l + ")"; }<\/script><script src="${coreURL}"><\/script>` +
    `<script src="${srcURL}${srcURL.includes("?") ? "&" : "?"}t=${Date.now()}" onerror="parent.__dgErr = 'could not load ${SRC}'"><\/script>`;
  window.__dgErr = null;
  f.onload = async () => {
    try {
      if (window.__dgErr) { $("when").textContent = "error: " + window.__dgErr; return; }
      const all = JSON.parse(JSON.stringify(f.contentWindow.DG?.all ?? [])), name = String(f.contentWindow.DG?.meta?.title ?? "");
      document.title = "diagram: " + (name || SRC.split("/").pop());
      if (!all.length) { $("when").textContent = `${SRC} drew nothing (no diagram(...) call)`; return; }
      const k = JSON.stringify(all); if (k === key) return; key = k; fb = { moves: {}, notes: [] };
      DG.reset(); DG.all.push(...all);
      await render(); $("when").textContent = "";
    } catch (e) { $("when").textContent = "error: " + e.message; console.error(e); }
    finally { f.remove(); busy = false; }
  };
  document.body.appendChild(f);
}

// libavoid (the line router), loaded once
let avoid = null, AV = null;
const router = () => (avoid ??= AvoidLib.load(AVOID_WASM).then(() => AvoidLib.getInstance()));
async function render() {
  const diags = [...DG.all];
  AV = await router(); routed = new Map();
  page = await DG.layoutPage(diags, AV, { only: ONLY });
  stage.innerHTML = DG.toSvg(page, diags, { img: (s) => new URL(s, srcURL).href });
  svg = stage.firstElementChild; svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.insertAdjacentHTML("beforeend", '<g id="overlay"></g>'); index();
  if (!cam && v0?.length === 3 && v0.every(Number.isFinite)) { cam = { x: v0[0], y: v0[1], z: v0[2] }; setCam(); }
  else if (!cam) fit(); else setCam();
  $("nissues").textContent = page.lint.length ? `${page.lint.length} issue${page.lint.length > 1 ? "s" : ""}` : "";
  $("issues").textContent = page.lint.join("\n");
  applyMoves();
  sel = new Set([...sel].filter(gOf)); drawSel(); showFb();
}
$("nissues").onclick = () => { const s = $("issues").style; s.display = s.display === "block" ? "none" : "block"; };

// ---- camera: the svg viewBox
// the view lives in the URL (&v=x,y,zoom): reload or share and you land on the same spot
let camT = 0;
function setCam() {
  const r = stage.getBoundingClientRect(); svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${r.width / cam.z} ${r.height / cam.z}`);
  clearTimeout(camT); camT = setTimeout(() => { const u = new URL(location.href); u.searchParams.set("v", `${Math.round(cam.x)},${Math.round(cam.y)},${+cam.z.toFixed(4)}`); history.replaceState(null, "", u); }, 250);
}
const v0 = q.get("v")?.split(",").map(Number);
function fit() {
  const b = DG.bbox(page.items), r = stage.getBoundingClientRect(), z = Math.min(r.width / (b.w + 200), r.height / (b.h + 200));
  cam = { z, x: b.x - 100 - (r.width / z - b.w - 200) / 2, y: b.y - 100 }; setCam();
}
const toD = (e) => { const r = stage.getBoundingClientRect(); return [cam.x + (e.clientX - r.left) / cam.z, cam.y + (e.clientY - r.top) / cam.z]; };
stage.addEventListener("wheel", (e) => {
  e.preventDefault(); if (!cam) return;
  if (e.ctrlKey || e.metaKey) {
    const [px, py] = toD(e), z = Math.min(8, Math.max(0.01, cam.z * Math.exp(-e.deltaY * 0.01)));
    cam.x = px - (px - cam.x) * cam.z / z; cam.y = py - (py - cam.y) * cam.z / z; cam.z = z;
  } else { cam.x += e.deltaX / cam.z; cam.y += e.deltaY / cam.z; }
  setCam();
}, { passive: false });

// ---- moves: a dragged group carries everything inside it
// built once per render: ITEM (id -> item), ANC (id -> the outlines it sits in), KIDS (outline -> everything inside it)
let ITEM = new Map(), ANC = new Map(), KIDS = new Map(), DRAWN = new Map(), DIAG = new Map();
function index() {
  ITEM = new Map(page.items.map((i) => [i.id, i])); ANC = new Map(); KIDS = new Map(); DRAWN = new Map(); DIAG = new Map();
  const walk = (ns, anc, d) => ns.forEach((n) => { if (!n?.id) return; ANC.set(n.id, anc); DIAG.set(n.id, d); for (const a of anc) KIDS.get(a).push(n.id);
    if (n.kind === "group") { KIDS.set(n.id, []); walk(n.kids ?? [], [...anc, n.id], d); } });
  DG.all.forEach((d) => walk(d.nodes ?? [], [], d));
}
const kids = (id) => KIDS.get(id) ?? [];  // lines are never contents: they follow their ends
// ---- THE position of everything: layout place + moves. Drawing, selection, box-select and feedback all read only this.
const itemOf = (id) => ITEM.get(id);
function offset(id) {  // its own move + the moves of every outline it sits in
  let x = 0, y = 0;
  for (const k of [id, ...(ANC.get(id) ?? [])]) { const m = fb.moves[k]; if (m) { x += m[0]; y += m[1]; } }
  return [x, y];
}
// lines routed again around the boxes where they are now (after a drag rests): id -> { k: its ends' offsets, pts, lab, n }
let routed = new Map(), nRoute = 0, rtT = 0;
const endsKey = (it) => offset(it.from).join() + "|" + offset(it.to).join();
const routeOf = (it) => { const r = routed.get(it.id); return r && r.k === endsKey(it) ? r : null; };
function rerouteNow() {
  clearTimeout(rtT); if (!AV || !page) return;
  // only the lines that need it: those with a moved end, and those now running through a moved box
  const moved = page.items.filter((i) => (i.t === "node" || i.t === "group") && offset(i.id).some((v) => v)).map((i) => place(i.id));
  const hits = (P) => moved.some((B) => P.some((q, i) => i && Math.max(q[0], P[i - 1][0]) > B.x && Math.min(q[0], P[i - 1][0]) < B.x + B.w && Math.max(q[1], P[i - 1][1]) > B.y && Math.min(q[1], P[i - 1][1]) < B.y + B.h));
  const only = new Set(page.items.filter((i) => (i.t === "edge" || i.t === "link") && i.from && (endsKey(i) !== "0,0|0,0" || hits(linePts(i)))).map((i) => i.id));
  const ds = new Set([...only].map((id) => DIAG.get(itemOf(id).from)).filter(Boolean));
  for (const d of ds) for (const it of DG.reroute(AV, d, (id) => place(id), only)) {
    const old = itemOf(it.id); if (old) routed.set(it.id, { k: endsKey(old), pts: it.pts, lab: it.lab, n: ++nRoute });
  }
  applyMoves(); drawSel();
}
function linePts(it) {  // a line follows its two boxes: routed again once a drag rests; meanwhile shifted whole, or a dog-leg between the moved ends
  const r = routeOf(it); if (r) return r.pts;
  const a = offset(it.from), b = offset(it.to);
  if (a[0] === b[0] && a[1] === b[1]) return it.pts.map(([x, y]) => [x + a[0], y + a[1]]);
  const s0 = [it.pts[0][0] + a[0], it.pts[0][1] + a[1]], e0 = it.pts[it.pts.length - 1], e = [e0[0] + b[0], e0[1] + b[1]];
  if (it.t === "link") return [s0, [(s0[0] + e[0]) / 2, s0[1]], [(s0[0] + e[0]) / 2, e[1]], e];
  const my = e[1] > s0[1] + 30 ? (s0[1] + e[1]) / 2 : e[1] - 18;
  return Math.abs(s0[0] - e[0]) < 0.5 ? [s0, e] : [s0, [s0[0], my], [e[0], my], e];
}
function place(id) {
  const it = itemOf(id); if (!it) return null;
  if (it.t === "edge" || it.t === "link") { const P = linePts(it), xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
    return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; }
  const [dx, dy] = offset(id), w = it.w ?? 0, h = it.h ?? 0;
  return it.t === "text" ? { ...DG.bbox([it]) } : { x: it.x + dx, y: it.y + dy, w, h };
}
function applyMoves() {  // draw every item where place() says it is
  for (const it of page.items) {
    const g = gOf(it.id); if (!g) continue;
    if (it.t === "node" || it.t === "group") { const [dx, dy] = offset(it.id); dx || dy ? g.setAttribute("transform", `translate(${dx},${dy})`) : g.removeAttribute("transform"); continue; }
    if (it.t !== "edge" && it.t !== "link") continue;
    const r = routeOf(it), k = endsKey(it) + "|" + (r ? r.n : "");
    if ((DRAWN.get(it.id) ?? "0,0|0,0|") === k) continue; DRAWN.set(it.id, k);  // nothing changed since it was drawn
    const pts = linePts(it), d = [pts[0][0] - it.pts[0][0], pts[0][1] - it.pts[0][1]];
    const lab = r ? r.lab : it.lab && { ...it.lab, x: it.lab.x + d[0], y: it.lab.y + d[1] };
    const tmp = document.createElementNS("http://www.w3.org/2000/svg", "g");
    tmp.innerHTML = it.t === "edge" ? DG.edgeSvg({ ...it, pts, lab }) : DG.linkSvg({ ...it, pts });
    g.replaceWith(tmp.firstElementChild);
  }
}
// ---- selection, box-select, move (as feedback)
const gOf = (id) => svg?.querySelector(`[data-id="${CSS.escape(id)}"]`);
const top_ = (el) => el?.closest?.("[data-id]");
function drawSel() {
  const o = svg?.querySelector("#overlay"); if (!o) return;
  o.innerHTML = [...sel].map(place).filter(Boolean).map((b) => `<rect class="sel-box" x="${b.x - 4}" y="${b.y - 4}" width="${b.w + 8}" height="${b.h + 8}" rx="6"/>`).join("");
}
let space = false, drag = null;
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;  // browser shortcuts stay the browser's
  if (e.code === "Space") { space = true; stage.classList.add("pan"); e.preventDefault(); }
  if (e.key === "Escape") { sel.clear(); drawSel(); }
  if (e.key === "f" || e.key === "F") fit();
  if (e.key === "r" || e.key === "R") resetMoves();
  if ((e.key === "n" || e.key === "N") && sel.size) {
    const t = prompt(`note on ${[...sel].join(", ")}:`); if (t) { fb.notes.push(`${[...sel].join(", ")}: ${t}`); saveFb(); }
  }
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") { space = false; stage.classList.remove("pan"); } });
// a drag of the current selection: only boxes and outlines move (lines follow their boxes), and a box inside a
// selected outline moves with the outline only, so only the outermost selected are dragged
function moveDrag(p) {
  const boxes = [...sel].filter((i) => { const it = itemOf(i); return it && (it.t === "node" || it.t === "group"); });
  const ids = boxes.filter((i) => !boxes.some((o) => o !== i && kids(o).includes(i)));
  return ids.length ? { kind: "move", p, ids, base: Object.fromEntries(ids.map((i) => [i, fb.moves[i] ?? [0, 0]])), moved: false } : null;
}
stage.addEventListener("pointerdown", (e) => {
  if (!cam || e.button === 2) return; e.preventDefault(); stage.setPointerCapture(e.pointerId);  // no browser text selection while dragging
  const p = toD(e);
  if (space || e.button === 1) { drag = { kind: "pan", sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y }; return; }
  const g = top_(e.target);
  if (g) {
    const id = g.dataset.id;
    if (e.shiftKey && sel.has(id)) { sel.delete(id); drawSel(); drag = null; return; }  // shift-click to deselect: nothing moves
    if (e.shiftKey) sel.add(id); else if (!sel.has(id)) sel = new Set([id]);
    drawSel();
    drag = moveDrag(p);
  } else if (!e.shiftKey && moveDrag(p)) {
    // press on empty space with a selection: hold and slide moves the selection; a plain click clears it
    drag = { ...moveDrag(p), clearOnClick: true };
  } else {
    if (!e.shiftKey) sel.clear();
    drag = { kind: "band", p, keep: new Set(sel) }; drawSel();
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (drag.kind === "pan") { cam.x = drag.cx - (e.clientX - drag.sx) / cam.z; cam.y = drag.cy - (e.clientY - drag.sy) / cam.z; setCam(); return; }
  const [x, y] = toD(e), dx = x - drag.p[0], dy = y - drag.p[1];
  if (drag.kind === "move") {
    if (Math.hypot(dx, dy) * cam.z < 4 && !drag.moved) return; drag.moved = true;
    for (const id of drag.ids) { const b = drag.base[id]; fb.moves[id] = [b[0] + dx, b[1] + dy]; }
    applyMoves(); drawSel(); clearTimeout(rtT); rtT = setTimeout(rerouteNow, 150); return;  // held still a moment: route the lines again
  }
  const x0 = Math.min(x, drag.p[0]), y0 = Math.min(y, drag.p[1]), w = Math.abs(dx), h = Math.abs(dy);
  sel = new Set(drag.keep);
  for (const g of svg.querySelectorAll("[data-id]")) {
    if (g.parentElement !== svg) continue;
    const b = place(g.dataset.id); if (b && b.x >= x0 && b.y >= y0 && b.x + b.w <= x0 + w && b.y + b.h <= y0 + h) sel.add(g.dataset.id);
  }
  drawSel();
  svg.querySelector("#overlay").insertAdjacentHTML("beforeend", `<rect class="band" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`);
});
stage.addEventListener("pointercancel", () => { drag = null; drawSel(); });
stage.addEventListener("pointerup", () => {
  if (drag?.clearOnClick && !drag.moved) { sel.clear(); drawSel(); }
  if (drag?.kind === "move" && drag.moved) { saveFb(); rerouteNow(); } if (drag?.kind === "band") drawSel(); drag = null; });

// ---- feedback: moves described relative to the nearest box, plus notes; copied as text for the agent
function where(id) {  // the nearest box that did not move with it, both at their current place()
  const b = place(id), o0 = offset(id); if (!b) return "";
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  let best = null, bd = Infinity;
  for (const it of page.items) {
    if (it.id === id || !(it.t === "node" || it.t === "group") || it.legend || kids(id).includes(it.id)) continue;
    const o = offset(it.id); if (o[0] === o0[0] && o[1] === o0[1] && (o0[0] || o0[1])) continue;  // moved together with it
    const r = place(it.id);
    if (r.x <= b.x && r.y <= b.y && r.x + r.w >= b.x + b.w && r.y + r.h >= b.y + b.h) continue;  // its own container
    const dx = Math.max(r.x - (b.x + b.w), b.x - (r.x + r.w), 0), dy = Math.max(r.y - (b.y + b.h), b.y - (r.y + r.h), 0), d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = { id: it.id, ...r }; }
  }
  if (!best) return "";
  const ox = best.x + best.w / 2, oy = best.y + best.h / 2, h = cx - ox, v = cy - oy;
  const rel = Math.abs(h) / (best.w + b.w) > Math.abs(v) / (best.h + b.h) ? (h > 0 ? "right of" : "left of") : (v > 0 ? "below" : "above");
  return `${rel} ${best.id}`;
}
function fbText() {
  const mv = Object.entries(fb.moves).filter(([, m]) => Math.hypot(...m) > 1)
    .map(([id, [dx, dy]]) => `move ${id} by (${dx > 0 ? "+" : ""}${Math.round(dx)}, ${dy > 0 ? "+" : ""}${Math.round(dy)}): wanted ${where(id)}`);
  return [...mv, ...fb.notes.map((n) => "note " + n)].join("\n");
}
function showFb() {
  const n = Object.values(fb.moves).filter((m) => Math.hypot(...m) > 1).length, k = fb.notes.length;
  $("fb").style.display = n || k ? "block" : "none";
  $("fbn").textContent = [n && `${n} moved`, k && `${k} note${k > 1 ? "s" : ""}`].filter(Boolean).join(", ");
}
let tt = 0;
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1400); };
$("fbcopy").onclick = async () => { const t = fbText(); await navigator.clipboard.writeText(`feedback on ${SRC}:\n` + t); toast(`copied feedback (${t.split("\n").length} line${t.includes("\n") ? "s" : ""})`); };
const resetMoves = () => { fb.moves = {}; fb.notes = []; saveFb(); key = ""; poll(); };
$("fbreset").onclick = resetMoves;

window.addEventListener("copy", (e) => {
  if (!page || !sel.size) return;
  e.clipboardData.setData("text/plain", `# ${SRC}: ${sel.size} selected\n` + DG.describe([...sel], page, DG.all)); e.preventDefault();
  toast(`copied ${sel.size} item${sel.size > 1 ? "s" : ""}`);
});
window.addEventListener("resize", () => cam && setCam());
poll(); setInterval(poll, 2000);
</script>
