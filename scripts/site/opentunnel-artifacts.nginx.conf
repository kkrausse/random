# Public artifacts for the opentunnel route (installed by setup-opentunnel.sh).
# Loopback only: the opentunnel client terminates TLS on this host and forwards
# plaintext here. Serves just the public shelf and its theme, read-only, so the
# rest of the kkrausse.com web root is not reachable through the tunnel.
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /var/www/html;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/opentunnel-artifacts.access.log;

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / { return 302 /artifacts/; }
    location = /theme.css { }
    location /artifacts/ { try_files $uri $uri/ =404; }
    # Dotfiles such as .published-at are bookkeeping, not content.
    location ~ /\. { return 404; }
    location / { return 404; }
}
