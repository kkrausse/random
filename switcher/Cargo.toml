[package]
name = "switcher"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
block2 = "0.6.2"
dirs = "6"
futures = "0.3"
global-hotkey = "0.10"
libc = "0.2"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nucleo-matcher = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
toml = "0.8"
tungstenite = "0.30"

[profile.release]
opt-level = 3
