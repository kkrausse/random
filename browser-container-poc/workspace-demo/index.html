<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace/Runtime API demo (placeholder)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      .row { display: flex; gap: 1rem; }
      .col { flex: 1; min-width: 0; }
      textarea { width: 100%; height: 200px; font-family: monospace; }
      #preview { width: 100%; height: 400px; border: 1px solid #999; }
      #logs { white-space: pre-wrap; background: #111; color: #eee; padding: 0.5rem; height: 200px; overflow: auto; }
      button { margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Workspace/Runtime API demo (placeholder)</h1>
    <p>Status: <span id="status">not connected</span></p>
    <div>
      <button id="open">Open workspace</button>
      <button id="start-vite" disabled>Start Vite</button>
      <button id="stop-vite" disabled>Stop Vite</button>
      <button id="flush" disabled>Flush + close</button>
    </div>
    <div class="row">
      <div class="col">
        <h2>Editor (/src/App.tsx)</h2>
        <textarea id="editor">export default function App() { return &lt;h1&gt;Hello&lt;/h1&gt;; }</textarea>
        <div>
          <button id="save">Write file</button>
          <button id="readback">Read back</button>
        </div>
      </div>
      <div class="col">
        <h2>Ripgrep</h2>
        <input id="query" value="TODO" />
        <button id="search">Search</button>
        <pre id="matches"></pre>
      </div>
    </div>
    <h2>Preview</h2>
    <iframe id="preview" title="preview"></iframe>
    <h2>Logs</h2>
    <div id="logs"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
